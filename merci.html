<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merci | Veryclean</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" href="logo.png" type="image/png">
    <style>
        :root {
            --primary: #0d6efd;
            --text: #1a1a2e;
            --text-muted: #5a5a6e;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 48px 36px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 420px;
            width: 100%;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 1.75rem;
            color: var(--primary);
            margin-bottom: 12px;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        a {
            display: inline-block;
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            font-weight: 600;
            border-radius: 10px;
            transition: background 0.2s;
        }
        a:hover { background: #0a58ca; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">✅</div>
        <h1>Merci !</h1>
        <p>Votre demande a bien été envoyée.<br>Nous vous répondons sous 24 h.</p>
        <a href="index.html">← Retour au site</a>
    </div>
</body>
</html>
